name: بناء تطبيق المندوب (Android APK)

# يبني ملف APK جاهزاً للتثبيت في السحابة — لا حاجة لتثبيت Android Studio محلياً.
# ملاحظة: التطبيق يحمّل الواجهة من الموقع مباشرة، فتحديثات الواجهة تصل فوراً بلا
# إعادة بناء. لا تحتاج APK جديداً إلّا عند تغيير الصلاحيات أو الإضافات أو إعداد
# Capacitor. لذلك البناء يدوي (زر Run) أو عند دفع وسم إصدار (مثل v1.0.0).
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: تهيئة Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile=false

      - name: بناء واجهة الويب
        run: pnpm exec vite build

      - name: مزامنة مشروع Capacitor
        run: pnpm exec cap sync android

      - name: بناء APK (debug — قابل للتثبيت مباشرة)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: xenon-delivery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # عند دفع وسم إصدار (مثل v1.0.0) يُنشَر الـ APK في صفحة Releases للتحميل المباشر
      - name: نشر إصدار (عند وجود وسم)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Xenon Delivery ${{ github.ref_name }}"
          body: "تطبيق المندوب — ملف APK قابل للتثبيت على أجهزة المندوبين."
