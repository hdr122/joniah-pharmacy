name: بناء تطبيق المندوب (Flutter APK)

# يبني تطبيق المندوب الأصلي (Flutter) في السحابة وينتج ملف APK جاهزاً للتثبيت.
# انقل هذا الملف إلى .github/workflows/flutter-apk.yml لتفعيله (صلاحية الدفع الحالية
# لا تملك نطاق workflow). شغّله يدوياً من تبويب Actions أو عند دفع وسم إصدار.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "app-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/xenon_rider
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: جلب الحزم
        run: flutter pub get

      - name: بناء APK (release)
        run: flutter build apk --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: xenon-rider-flutter-apk
          path: mobile/xenon_rider/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: نشر إصدار (عند وجود وسم app-v*)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/xenon_rider/build/app/outputs/flutter-apk/app-release.apk
          name: "Xenon Rider (Flutter) ${{ github.ref_name }}"
          body: "تطبيق المندوب الأصلي (Flutter) — ملف APK قابل للتثبيت."
